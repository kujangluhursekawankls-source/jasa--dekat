<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="primaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Pin Accent Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circle Frame -->
  <circle cx="256" cy="256" r="240" fill="url(#primaryBg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-opacity="0.85" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12" />

  <!-- Modern House Structure -->
  <!-- House Roof Peak -->
  <path d="M128 248 L256 128 L384 248" fill="none" stroke="url(#roofGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
  
  <!-- Chimney / Decorative accent on roof -->
  <path d="M328 170 V140 H354 V195" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- House Body / Walls -->
  <path d="M164 246 V374 C164 385 173 394 184 394 H328 C339 394 348 385 348 374 V246" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Handyman Crossed Tools: Wrench & Hammer in Center -->
  <!-- Wrench -->
  <g transform="translate(256, 310) rotate(-45) translate(-256, -310)">
    <rect x="246" y="240" width="20" height="120" rx="10" fill="#94a3b8" />
    <!-- Wrench Head Open -->
    <path d="M236 244 C236 220 256 210 256 210 C256 210 276 220 276 244 C276 250 268 256 256 256 C244 256 236 250 236 244 Z" fill="#cbd5e1" />
    <circle cx="256" cy="235" r="9" fill="#0f172a" />
  </g>

  <!-- Screwdriver / Tool 2 -->
  <g transform="translate(256, 310) rotate(45) translate(-256, -310)">
    <rect x="248" y="246" width="16" height="114" rx="8" fill="#e2e8f0" />
    <!-- Handle -->
    <rect x="244" y="300" width="24" height="65" rx="10" fill="#f97316" />
    <rect x="248" y="315" width="16" height="6" rx="2" fill="#ea580c" />
    <rect x="248" y="335" width="16" height="6" rx="2" fill="#ea580c" />
  </g>

  <!-- Location Pin Floating at Top Center (Symbolizing 'Dekat' / Nearby) -->
  <g filter="url(#glow)">
    <!-- Pin Body -->
    <path d="M256 160 C234 160 216 178 216 200 C216 228 256 268 256 268 C256 268 296 228 296 200 C296 178 278 160 256 160 Z" fill="url(#pinGrad)" />
    <!-- Inner Pin Dot -->
    <circle cx="256" cy="198" r="14" fill="#ffffff" />
    <circle cx="256" cy="198" r="6" fill="#ea580c" />
  </g>

  <!-- Verified Shield / Check badge at bottom right -->
  <circle cx="366" cy="366" r="38" fill="#10b981" />
  <circle cx="366" cy="366" r="34" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" />
  <path d="M352 366 L362 376 L382 354" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
