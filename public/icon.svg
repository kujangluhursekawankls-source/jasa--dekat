  <circle cx="210" cy="270" r="24" fill="none" stroke="#60a5fa" stroke-width="18" />

  <!-- WhatsApp / Direct contact badge -->
  <circle cx="370" cy="370" r="64" fill="url(#accent)" />
  <path d="M352 352 C350 358 358 376 376 384 C382 386 388 384 391 380 L394 374 C395 372 393 370 391 369 L380 364 C378 363 376 364 375 365 L372 368 C368 365 363 360 360 356 L363 353 C364 352 365 350 364 348 L359 337 C358 335 356 333 354 334 L348 337 C344 340 342 346 344 352" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
